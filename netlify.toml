[build]
  command = "npm run build"
  publish = "dist"

# Proxy every /api/* request to the Node/Fastify backend hosted on Fly.io.
# Override BACKEND_API_ORIGIN in the Netlify UI (Build → Environment) when
# pointing at staging or preview deployments.
[[redirects]]
  from = "/api/*"
  to = "https://frontieros-api.fly.dev/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
