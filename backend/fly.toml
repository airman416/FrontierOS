# Fly.io configuration for the FrontierOS Node backend.
# Rename `app` below to whatever you picked during `fly launch`.

app = "frontieros-api"
primary_region = "sjc"

[build]

[env]
  PORT = "8080"
  NODE_ENV = "production"
  # Optional overrides - defaults live in src/env.ts
  # OPENROUTER_MODEL = "google/gemini-2.5-flash"
  # HTTP_REFERER = "https://frontier-os.netlify.app"
  # ALLOWED_ORIGINS = "https://frontier-os.netlify.app,http://localhost:5173"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 50
    soft_limit = 40

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
